{% extends 'V2_form_base.html' %}

{% block form_content %}
    <div class="text-left">
        <h2 class="text-2xl font-bold text-gray-800 mb-1">{{ titulo }}</h2>
        <p class="text-sm text-gray-500 mb-6">Ingrese los datos del dispositivo móvil.</p>
    </div>

    <form method="POST" action="{{ url_for('inventario.add_edit_dispositivo', tipo_id=celular.tipo if celular else current_tipo, id_dispositivo=celular.id_dispositivo) if celular else url_for('inventario.add_edit_dispositivo', tipo_id=current_tipo) }}">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div>
                <label for="marca" class="block text-sm font-medium text-gray-700 mb-1">Marca</label>
                <select id="marca" name="marca" required class="w-full border-gray-300 rounded-lg shadow-sm focus:border-emerald-500 focus:ring-emerald-500 p-2">
                    <option value="">-- Seleccione Marca --</option>
                    {% for marca in marcas %}
                        <option value="{{ marca.id_marca }}" 
                            {% if celular and celular.marca == marca.id_marca %}selected{% endif %}>
                            {{ marca.nombre }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="modelo" class="block text-sm font-medium text-gray-700 mb-1">Modelo</label>
                <input type="text" id="modelo" name="modelo" value="{{ celular.modelo if celular else '' }}" required class="w-full border-gray-300 rounded-lg shadow-sm focus:border-emerald-500 focus:ring-emerald-500 p-2">
            </div>

            <div>
                <label for="identificador" class="block text-sm font-medium text-gray-700 mb-1">IMEI</label>
                <input type="text" id="identificador" name="identificador" value="{{ celular.identificador if celular else '' }}" required class="w-full border-gray-300 rounded-lg shadow-sm focus:border-emerald-500 focus:ring-emerald-500 p-2">
            </div>

            <div>
                <label for="estado" class="block text-sm font-medium text-gray-700 mb-1">Estado</label>
                <select id="estado" name="estado" required class="w-full border-gray-300 rounded-lg shadow-sm focus:border-emerald-500 focus:ring-emerald-500 p-2">
                    <option value="">-- Seleccione Estado --</option>
                    {% for estado in estados %}
                        <option value="{{ estado.id_status }}" 
                            {% if celular and celular.estado == estado.id_status %}selected{% endif %}>
                            {{ estado.estado }}
                        </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 mb-6">
            <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wide mb-3 border-b pb-1">Finanzas y Adquisición</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="costo" class="block text-sm font-medium text-gray-700 mb-1">Costo de Adquisición ($)</label>
                    <input type="number" step="0.01" id="costo" name="costo" 
                           value="{{ celular.costo if celular else '' }}" 
                           placeholder="0.00"
                           class="w-full border-gray-300 rounded-lg shadow-sm focus:border-emerald-500 focus:ring-emerald-500 p-2">
                </div>
                <div>
                    <label for="fecha_compra" class="block text-sm font-medium text-gray-700 mb-1">Fecha de Compra</label>
                    <input type="date" id="fecha_compra" name="fecha_compra" 
                           value="{{ celular.fecha_compra if celular else '' }}" 
                           class="w-full border-gray-300 rounded-lg shadow-sm focus:border-emerald-500 focus:ring-emerald-500 p-2">
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 p-4 border border-blue-100 bg-blue-50 rounded-lg">
            <div class="md:col-span-3">
                <h3 class="text-xs font-bold text-blue-500 uppercase tracking-wide mb-2">Datos de Línea</h3>
            </div>
            <div>
                <label for="numero" class="block text-sm font-medium text-gray-700 mb-1">Número de Teléfono</label>
                <input type="text" id="numero" name="numero" value="{{ celular.numerotel if celular else '' }}" class="w-full border-gray-300 rounded-lg shadow-sm p-2">
            </div>
            <div>
                <label for="plan_inicio" class="block text-sm font-medium text-gray-700 mb-1">Inicio de Plan</label>
                <input type="date" id="plan_inicio" name="plan_inicio" value="{{ celular.plan_inicio if celular and celular.plan_inicio else '' }}" class="w-full border-gray-300 rounded-lg shadow-sm p-2">
            </div>
            <div>
                <label for="plan_fin" class="block text-sm font-medium text-gray-700 mb-1">Fin de Plan</label>
                <input type="date" id="plan_fin" name="plan_fin" value="{{ celular.plan_fin if celular and celular.plan_fin else '' }}" class="w-full border-gray-300 rounded-lg shadow-sm p-2">
            </div>
        </div>

        <div class="mb-6">
            <div class="mb-4">
                <label for="usuario" class="block text-sm font-medium text-gray-700 mb-1">Usuario Asignado</label>
                <select id="usuario" name="usuario" class="w-full border-gray-300 rounded-lg shadow-sm focus:border-emerald-500 focus:ring-emerald-500 p-2">
                    <option value="">-- Sin Asignar --</option>
                    {% for usuario in usuarios %}
                        <option value="{{ usuario.id_usuario }}" 
                            {% if celular and celular.usuario == usuario.id_usuario %}selected{% endif %}>
                            {{ usuario.nombre }} {{ usuario.apellidos }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            
            <div>
                <label for="extra_data" class="block text-sm font-medium text-gray-700 mb-1">Datos Adicionales</label>
                <textarea id="extra_data" name="extra_data" rows="2" class="w-full border-gray-300 rounded-lg shadow-sm focus:border-emerald-500 focus:ring-emerald-500 p-2">{{ celular.extra_info if celular else '' }}</textarea>
            </div>
        </div>

        <div class="flex justify-end space-x-4 pt-4 border-t border-gray-100">
            <button type="button" onclick="closeModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-lg transition duration-300">
                Cancelar
            </button>
            <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition duration-300">
                {% if celular %}Guardar Cambios{% else %}Añadir Celular{% endif %}
            </button>
        </div>
    </form>
{% endblock %}
