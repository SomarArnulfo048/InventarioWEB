{% extends 'base.html' %}

{% block content %}
    <h1 class="text-4xl font-extrabold text-gray-800 mb-8 border-b pb-2">Panel de Control</h1>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="bg-white rounded-xl shadow-md p-6 border-l-4 border-emerald-500 flex items-center justify-between">
            <div>
                <p class="text-gray-500 text-sm font-medium uppercase">Total Activos</p>
                <p class="text-4xl font-bold text-gray-800">{{ stats.total_dispositivos }}</p>
            </div>
            <div class="p-3 bg-emerald-100 rounded-full text-emerald-600">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path></svg>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-10">
        <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-100">
            <h3 class="text-lg font-bold text-gray-700 mb-4 text-center">Dispositivos por Tipo</h3>
            <div class="relative h-64">
                <canvas id="chartTipos"></canvas>
            </div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-100">
            <h3 class="text-lg font-bold text-gray-700 mb-4 text-center">Estado del Inventario</h3>
            <div class="relative h-64">
                <canvas id="chartEstados"></canvas>
            </div>
        </div>
    </div>

    <div class="max-w-5xl mx-auto bg-white p-6 rounded-xl shadow-lg border border-gray-100">
        <div class="flex flex-col sm:flex-row justify-between items-center mb-6">
            <h3 class="text-xl font-bold text-gray-800">Análisis de Inversión ($)</h3>
            
            <div class="mt-4 sm:mt-0">
                <select id="yearFilter" onchange="updateFinanceChart()" class="block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm rounded-md border shadow-sm">
                    <option value="total">Histórico Total (Por Años)</option>
                    {% for y in years %}
                        <option value="{{ y.anio }}">Desglose {{ y.anio }} (Mensual)</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        
        <div class="relative h-80 w-full">
            <canvas id="chartFinanzas"></canvas>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        // --- GRÁFICAS ESTÁTICAS (Tipos y Estados) ---
        const tiposLabels = [{% for t in stats.por_tipo %}"{{ t.nombre }}",{% endfor %}];
        const tiposData = [{% for t in stats.por_tipo %}{{ t.total }},{% endfor %}];
        const tiposColors = [{% for t in stats.por_tipo %}"{{ t.color }}",{% endfor %}];

        new Chart(document.getElementById('chartTipos'), {
            type: 'doughnut',
            data: { labels: tiposLabels, datasets: [{ data: tiposData, backgroundColor: tiposColors, borderWidth: 0 }] },
            options: { responsive: true, maintainAspectRatio: false }
        });

        const estadosLabels = [{% for e in stats.por_estado %}"{{ e.estado }}",{% endfor %}];
        const estadosData = [{% for e in stats.por_estado %}{{ e.total }},{% endfor %}];

        new Chart(document.getElementById('chartEstados'), {
            type: 'bar',
            data: { labels: estadosLabels, datasets: [{ label: 'Cantidad', data: estadosData, backgroundColor: '#10B981', borderRadius: 5 }] },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
        });

        // --- GRÁFICA FINANCIERA DINÁMICA ---
        let financeChart = null;

        function initFinanceChart(labels, data, labelTitle) {
            const ctx = document.getElementById('chartFinanzas').getContext('2d');
            
            if (financeChart) { financeChart.destroy(); }

            financeChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: labelTitle,
                        data: data,
                        borderColor: '#3B82F6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        borderWidth: 3,
                        pointBackgroundColor: '#fff',
                        pointBorderColor: '#3B82F6',
                        pointRadius: 5,
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: true, position: 'top' },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return '$ ' + new Intl.NumberFormat('es-MX').format(context.raw);
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) { return '$' + value; }
                            }
                        }
                    }
                }
            });
        }

        // Función para pedir datos a la API
        function updateFinanceChart() {
            const selectedYear = document.getElementById('yearFilter').value;
            const url = `{{ url_for('inventario.api_finanzas') }}?year=${selectedYear}`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    const title = selectedYear === 'total' ? 'Inversión Total por Año' : `Inversión Mensual (${selectedYear})`;
                    initFinanceChart(data.labels, data.data, title);
                })
                .catch(error => console.error('Error cargando gráfica:', error));
        }

        // Cargar la gráfica al inicio
        document.addEventListener('DOMContentLoaded', updateFinanceChart);
    </script>
{% endblock %}
