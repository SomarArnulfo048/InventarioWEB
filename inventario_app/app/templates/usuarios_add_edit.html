{% extends 'V2_form_base.html' %}

{% block form_content %}
    <div class="text-left">
        <h2 class="text-2xl font-bold text-gray-800 mb-1">{{ titulo }}</h2>
        <p class="text-sm text-gray-500 mb-6">Ingrese los datos del usuario.</p>
    </div>

    <form method="POST" action="{{ url_for('inventario.add_edit_usuario', id_usuario=usuario.id_usuario) if usuario else url_for('inventario.add_edit_usuario') }}">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8 border p-4 rounded-lg bg-gray-50">
            <div>
                <label for="nombre" class="block text-sm font-medium text-gray-700 mb-1">Nombre(s)</label>
                <input type="text" id="nombre" name="nombre" value="{{ usuario.nombre if usuario else '' }}" required class="w-full border-gray-300 rounded-lg shadow-sm focus:border-emerald-500 focus:ring-emerald-500 p-2">
            </div>

            <div>
                <label for="apellidos" class="block text-sm font-medium text-gray-700 mb-1">Apellidos</label>
                <input type="text" id="apellidos" name="apellidos" value="{{ usuario.apellidos if usuario else '' }}" required class="w-full border-gray-300 rounded-lg shadow-sm focus:border-emerald-500 focus:ring-emerald-500 p-2">
            </div>

            <div>
                <label for="correo" class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
                <input type="email" id="correo" name="correo" value="{{ usuario.correo if usuario else '' }}" required class="w-full border-gray-300 rounded-lg shadow-sm focus:border-emerald-500 focus:ring-emerald-500 p-2">
            </div>

            <div>
                <label for="empresa" class="block text-sm font-medium text-gray-700 mb-1">Empresa</label>
                <select id="empresa" name="empresa" class="w-full border-gray-300 rounded-lg shadow-sm focus:border-emerald-500 focus:ring-emerald-500 p-2">
                    <option value="">-- Sin Empresa --</option>
                    {% for empresa in empresas %}
                        <option value="{{ empresa.id_empresa }}" 
                            {% if usuario and usuario.empresa == empresa.id_empresa %}selected{% endif %}>
                            {{ empresa.nombre }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="fecha_ingreso" class="block text-sm font-medium text-gray-700 mb-1">Fecha de Ingreso</label>
                <input type="date" id="fecha_ingreso" name="fecha_ingreso" 
                     value="{{ usuario.fecha_ingreso if usuario else '' }}" 
                        class="w-full border-gray-300 rounded-lg shadow-sm focus:border-emerald-500 focus:ring-emerald-500 p-2">
            </div>
            
        </div>

        <div class="flex justify-end space-x-4 pt-4 border-t border-gray-100">
            <button type="button" onclick="closeModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-lg transition duration-300">
                Cancelar
            </button>
            <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition duration-300">
                {% if usuario %}Guardar Cambios{% else %}Añadir Usuario{% endif %}
            </button>
        </div>
    </form>
{% endblock %}
