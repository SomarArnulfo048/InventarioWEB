{% extends 'V2_form_base.html' %}

{% block form_content %}
    <div class="text-left">
        <h2 class="text-2xl font-bold text-gray-800 mb-1">{{ titulo }}</h2>
        <p class="text-sm text-gray-500 mb-6">Ingrese los datos de la computadora portátil.</p>
    </div>

    <form method="POST" action="{{ url_for('inventario.add_edit_dispositivo', tipo_id=laptop.tipo if laptop else current_tipo, id_dispositivo=laptop.id_dispositivo) if laptop else url_for('inventario.add_edit_dispositivo', tipo_id=current_tipo) }}">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div>
                <label for="marca" class="block text-sm font-medium text-gray-700 mb-1">Marca</label>
                <select id="marca" name="marca" required class="w-full border-gray-300 rounded-lg shadow-sm focus:border-emerald-500 focus:ring-emerald-500 p-2">
                    <option value="">-- Seleccione Marca --</option>
                    {% for marca in marcas %}
                        <option value="{{ marca.id_marca }}" 
                            {% if laptop and laptop.marca == marca.id_marca %}selected{% endif %}>
                            {{ marca.nombre }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="modelo" class="block text-sm font-medium text-gray-700 mb-1">Modelo</label>
                <input type="text" id="modelo" name="modelo" value="{{ laptop.modelo if laptop else '' }}" required class="w-full border-gray-300 rounded-lg shadow-sm focus:border-emerald-500 focus:ring-emerald-500 p-2">
            </div>

            <div>
                <label for="identificador" class="block text-sm font-medium text-gray-700 mb-1">Número de Serie (S/N)</label>
                <input type="text" id="identificador" name="identificador" value="{{ laptop.identificador if laptop else '' }}" required class="w-full border-gray-300 rounded-lg shadow-sm focus:border-emerald-500 focus:ring-emerald-500 p-2">
            </div>

            <div>
                <label for="estado" class="block text-sm font-medium text-gray-700 mb-1">Estado</label>
                <select id="estado" name="estado" required class="w-full border-gray-300 rounded-lg shadow-sm focus:border-emerald-500 focus:ring-emerald-500 p-2">
                    <option value="">-- Seleccione Estado --</option>
                    {% for estado in estados %}
                        <option value="{{ estado.id_status }}" 
                            {% if laptop and laptop.estado == estado.id_status %}selected{% endif %}>
                            {{ estado.estado }}
                        </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 mb-6">
            <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wide mb-3 border-b pb-1">Finanzas y Adquisición</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="costo" class="block text-sm font-medium text-gray-700 mb-1">Costo de Adquisición ($)</label>
                    <input type="number" step="0.01" id="costo" name="costo" 
                           value="{{ laptop.costo if laptop else '' }}" 
                           placeholder="0.00"
                           class="w-full border-gray-300 rounded-lg shadow-sm focus:border-emerald-500 focus:ring-emerald-500 p-2">
                </div>

                <div>
                    <label for="fecha_compra" class="block text-sm font-medium text-gray-700 mb-1">Fecha de Compra</label>
                    <input type="date" id="fecha_compra" name="fecha_compra" 
                           value="{{ laptop.fecha_compra if laptop else '' }}" 
                           class="w-full border-gray-300 rounded-lg shadow-sm focus:border-emerald-500 focus:ring-emerald-500 p-2">
                </div>
            </div>
        </div>

        <div class="mb-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4">
                <div>
                    <label for="usuario" class="block text-sm font-medium text-gray-700 mb-1">Usuario Asignado</label>
                    <select id="usuario" name="usuario" class="w-full border-gray-300 rounded-lg shadow-sm focus:border-emerald-500 focus:ring-emerald-500 p-2">
                        <option value="">-- Sin Asignar --</option>
                        {% for usuario in usuarios %}
                            <option value="{{ usuario.id_usuario }}" 
                                {% if laptop and laptop.usuario == usuario.id_usuario %}selected{% endif %}>
                                {{ usuario.nombre }} {{ usuario.apellidos }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div>
                <label for="extra_data" class="block text-sm font-medium text-gray-700 mb-1">Datos Adicionales</label>
                <textarea id="extra_data" name="extra_data" rows="2" class="w-full border-gray-300 rounded-lg shadow-sm focus:border-emerald-500 focus:ring-emerald-500 p-2">{{ laptop.extra_info if laptop else '' }}</textarea>
            </div>
        </div>

        <div class="flex justify-end space-x-4 border-t pt-4 border-gray-100">
            <button type="button" onclick="closeModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-lg transition duration-300">
                Cancelar
            </button>
            <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition duration-300">
                {% if laptop %}Guardar Cambios{% else %}Añadir Laptop{% endif %}
            </button>
        </div>
    </form>
{% endblock %}
